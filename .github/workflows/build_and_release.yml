name: Build and Release Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build_and_release_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Rename package identifiers
        run: |
          find . -type f \( -name "*.kt" -o -name "*.xml" -o -name "*.gradle" -o -name "*.gradle.kts" \) | \
          xargs sed -i \
            -e 's/^package io\./package ai./g' \
            -e 's/^import io\.github\.shubham0204/import ai.github.Astran/g' \
            -e 's/"io\.github\.shubham0204/"ai.github.Astran/g' \
            -e 's/shubham0204/Astran/g' \
            -e 's/smollmandroid/AstranAi/g'
          find . -type d -name "shubham0204" | while read dir; do
            mv "$dir" "${dir/shubham0204/Astran}"
          done
          find . -type d -iname "smollmandroid" | while read dir; do
            mv "$dir" "${dir/smollmandroid/AstranAi}"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Get version
        id: version
        run: echo "VERSION=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: AstranAi v${{ steps.version.outputs.VERSION }}
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}