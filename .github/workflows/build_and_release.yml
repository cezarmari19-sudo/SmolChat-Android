name: Build and Release Android APK

on:
  push:
    branches:
      - main

jobs:
  build_and_release_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: 'true'

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27c
          add-to-path: true
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Rename package to AstranAI
        run: |
          find app/src -name "*.kt" -exec sed -i 's/io\.shubham0204\.smollmandroid/ai\.Astran\.AstranAi/g' {} +
          find app/src -name "*.kt" -exec sed -i 's/io\/shubham0204\/smollmandroid/ai\/Astran\/AstranAi/g' {} +
          find app/src -name "*.xml" -exec sed -i 's/io\.shubham0204\.smollmandroid/ai\.Astran\.AstranAi/g' {} +
          find app/src -name "*.xml" -exec sed -i 's/io\/shubham0204\/smollmandroid/ai\/Astran\/AstranAi/g' {} +
          mkdir -p app/src/main/java/ai/Astran/AstranAi
          cp -r app/src/main/java/io/shubham0204/smollmandroid/. app/src/main/java/ai/Astran/AstranAi/
          rm -rf app/src/main/java/io

      - name: Build APK
        run: ./gradlew assembleDebug --info 2>&1 | tail -200

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AstranAI-debug
          path: app/build/outputs/apk/debug/app-debug.apk